<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Editable university business research project website draft."
    />
    <title>Digital Growth | F&B Small-Business Research</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260601-fnb4" />
  </head>
  <body>
    <div class="announcement" id="announcement"></div>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="Research project home">
        <span class="logo-placeholder" id="universityLogo">UNIKL</span>
        <span class="brand-copy">
          <strong id="brandName"></strong>
          <small id="brandSubline"></small>
        </span>
      </a>
      <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="mainNav">
        MENU
      </button>
      <nav class="main-nav" id="mainNav" aria-label="Main navigation"></nav>
    </header>

    <main>
      <section class="hero" id="home">
        <img id="heroImage" alt="" />
        <div class="hero-copy content-width">
          <h1 id="researchTitle"></h1>
          <p id="researchSummary"></p>
          <div class="button-row">
            <a class="button button-primary" href="#journey">EXPLORE THE JOURNEY</a>
            <a class="button button-secondary" id="heroQuestionnaire" href="#questionnaire">GO TO QUESTIONNAIRE</a>
          </div>
        </div>
      </section>

      <section class="lecturer content-width section" id="lecturer"></section>

      <section class="university-band">
        <img id="universityImage" alt="Universiti Kuala Lumpur campus context" />
        <div>
          <p class="university-label">UNIVERSITY CONTEXT</p>
          <h2 id="universityName"></h2>
          <p id="universityNote"></p>
        </div>
      </section>

      <section class="members section" id="members">
        <div class="content-width">
          <div class="section-heading centered">
            <span></span>
            <h2>GROUP MEMBERS</h2>
          </div>
          <div class="member-grid" id="memberGrid"></div>
        </div>
      </section>

      <section class="about split-section" id="about">
        <div class="split-copy">
          <div class="section-heading">
            <span></span>
            <h2>ABOUT THE RESEARCH</h2>
          </div>
          <p id="aboutText"></p>
          <div class="about-points" id="aboutPoints"></div>
        </div>
        <img id="aboutImage" alt="Independent cafe interior" />
      </section>

      <section class="journey section" id="journey">
        <div class="content-width">
          <div class="journey-intro">
            <div class="section-heading">
              <span></span>
              <h2>RESEARCH JOURNEY</h2>
            </div>
          </div>
          <div class="journey-grid" id="journeyGrid"></div>
        </div>
      </section>

      <section class="research-content section" id="research-content">
        <div class="content-width">
          <div class="research-content-intro">
            <div class="section-heading">
              <span></span>
              <h2>RESEARCH DOCUMENTATION</h2>
            </div>
          </div>
          <div class="research-section-list" id="researchSectionList"></div>
        </div>
      </section>

      <section class="questionnaire split-section" id="questionnaire">
        <div class="split-copy">
          <div class="section-heading">
            <span></span>
            <h2>QUESTIONNAIRE</h2>
          </div>
          <p id="questionnaireText"></p>
          <a class="button button-primary" id="questionnaireLink" href="#" target="_blank" rel="noreferrer">
            OPEN GOOGLE FORM QUESTIONNAIRE
          </a>
        </div>
        <img id="questionnaireImage" alt="Small-business owner using a digital payment device" />
      </section>

      <section class="references section" id="references">
        <div class="content-width references-inner">
          <div class="section-heading">
            <span></span>
            <h2>REFERENCES / BIBLIOGRAPHY</h2>
          </div>
          <p id="referencesText"></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="content-width footer-grid">
        <div id="contact">
          <a class="brand footer-brand" href="#home">
            <span class="logo-placeholder">UNIKL</span>
            <strong id="footerBrandName"></strong>
          </a>
          <p id="footerNote"></p>
        </div>
        <div>
          <h3>QUICK LINKS</h3>
          <nav id="footerNav" aria-label="Footer navigation"></nav>
        </div>
        <div>
          <h3>CONTACT</h3>
          <p id="contactDetails"></p>
        </div>
      </div>
      <div class="copyright" id="copyright"></div>
    </footer>

    <script src="./content.js?v=20260601-fnb4"></script>
    <script src="./app.js?v=20260601-fnb4"></script>
  </body>
</html>
